name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: lint + unit + integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # tests/test_rendered_output.py EXECUTES the shipped first-party JS
      # (Node stdlib `vm`, no npm install) so it can assert on what the cards
      # produce instead of on what their source says. Declared here rather than
      # relied on as a runner accident: the tests FAIL when node is missing —
      # they must never turn into a silent skip.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --version
      # tests/test_cards_register_in_browser.py drives a headless Chromium
      # through the load order HA's index.html produces, because "the file
      # contains customElements.define()" was TRUE for every first-party card on
      # the day none of them existed in the browser. It FAILS (never skips) when
      # its runtime is missing, so these two steps are part of the gate.
      - name: Browser test deps
        run: npm ci
        working-directory: tests/browser
      - name: Chromium for the card-registration proof
        run: npx playwright install --with-deps chromium
        working-directory: tests/browser
      - run: pip install pytest PyYAML ruff
      - name: Ruff lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q
      - name: Vendored integrity (offline, against the lock)
        run: python scripts/vendor.py --check

  vendor-verify:
    name: supply-chain re-download verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyYAML
      - name: Re-download every card and verify sha256 against the lock
        run: python scripts/vendor.py
      - name: Assert the committed vendored tree is exactly reproducible
        run: git diff --exit-code -- custom_components
